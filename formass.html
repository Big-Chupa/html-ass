<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="">
        <caption><h2>REGISTRATION FORM</h2></caption>
        <fieldset>
            <legend>PERSONAL INFORMATION</legend>
            <label for="name">NAME:</label> <br>
            <input type="text" name="" id="" placeholder="Firstname" required> <br>
            <input type="text" name="" id="" placeholder="Lastname" required> <br> <br>
            <label for="dob">DATE OF BIRTH:</label> <br>
            <input type="date" name="" id="" required> <br> <br>
            <label for="country">NATIONALITY:</label> <br>
            <select name="" id="" required>
                <option value="">Select your country</option>
                <option value="">Argentina</option>
                <option value="">Belgium</option>
                <option value="">Cameroon</option>
                <option value="">Denmark</option>
                <option value="">England</option>
                <option value="">Finland</option>
                <option value="">Georgia</option>
                <option value="">Hungary</option>
                <option value="">Israel</option>
                <option value="">Jordan</option>
                <option value="">Kuwait</option>
                <option value="">Lebanon</option>
                <option value="">Mangolia</option>
                <option value="">Nigeria</option>
                <option value="">Oman</option>
                <option value="">Peru</option>
                <option value="">Qatar</option>
                <option value="">Russia</option>
                <option value="">Senegal</option>
                <option value="">Tunisia</option>
                <option value="">Uganda</option>
                <option value="">Venezuela</option>
                <option value="">Wales</option>
                <option value="">Xinji</option>
                <option value="">Yemen</option>
                <option value="">Zambia</option>
            </select> <br> <br>
            <label for="gender">GENDER:</label> <br>
            <input type="radio" name="gender" id="" checked>Male
            <input type="radio" name="gender" id="">Female <br> <br>
            <label for="hobby">HOBBIES:</label> <br>
            <input type="checkbox" name="hobby" id=""> Music
            <input type="checkbox" name="hobby" id=""> Dance
            <input type="checkbox" name="hobby" id=""> Football <br>
            <input type="checkbox" name="hobby" id=""> Reading
            <input type="checkbox" name="hobby" id=""> Movies
            <input type="checkbox" name="hobby" id=""> Others
        </fieldset>
        <fieldset>
            <legend>CERTIFICATION</legend>
            <label for="cert">UPLOAD CERTIFICATION</label> <br>
            <input type="file" name="" id="" required>
        </fieldset>
        <fieldset>
            <legend>CREATE ACCOUNT</legend>
            <label for="number">PHONE NUMBER:</label> <br>
            <input type="tel" name="" id="" placeholder="000-0000-0000" required> <br>
            <label for="email">EMAIL:</label> <br>
            <input type="email" name="" id="" required> <br>
            <label for="password">PASSWORD:</label> <br>
            <input type="password" name="" id="" required>
        </fieldset> <br>
        <input type="reset" name="" id="">
        <input type="submit" name="" id="">
    </form>
    <p><a href="assignment.html">BIO</a></p>
</body>
</html>
